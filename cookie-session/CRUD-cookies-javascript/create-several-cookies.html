<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create and Read Several Cookies</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        button { margin: 0.5em 0.5em 0.5em 0; }
        #output { margin-top: 1em; padding: 1em; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Cookie Demo: Create and Read Several Cookies</h1>
    <button onclick="setCookies()">Set Several Cookies</button>
    <button onclick="showCookies()">Show All Cookies</button>
    <button onclick="deleteCookies()">Delete All Demo Cookies</button>
    <div id="output"></div>
    <script>
        function setCookies() {
            document.cookie = "user=Alice; expires=Thu, 18 Dec 2028 12:00:00 UTC; path=/";
            document.cookie = "theme=dark; expires=Thu, 18 Dec 2028 12:00:00 UTC; path=/";
            document.cookie = "session=xyz123; max-age=3600; path=/";
            document.getElementById('output').textContent = 'Cookies set!';
        }
        function showCookies() {
            document.getElementById('output').textContent = document.cookie;
        }
        function deleteCookies() {
            // Only delete the demo cookies
            
            ['user', 'theme', 'session'].forEach(name => {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
            });
            document.getElementById('output').textContent = 'Demo cookies deleted!';
        }
    </script>
</body>
</html>
