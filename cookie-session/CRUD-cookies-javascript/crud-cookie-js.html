<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Cookie Demo</title>
  <style>
        ul {
            list-style: none;
        }
        ul > li {
            margin-top: 10px;
        }
        button {
            width: 160px;
            height: 40px;
            background-color: darkgreen;
            color: white;
        }
  </style>
</head>
<body>
    <h1>This page demonstrates</h1>
    <ul>
        <li><button onclick="setCookie()">Set Cookie</button></li>
        <li><button onclick="getCookie()">Get Cookie</button></li>
        <li><button onclick="updateCookie()">Update Cookie</button></li>
        <li><button onclick="deleteCookie()">Delete Cookie</button></li>
  </ul>
  <script>
    function setCookie() {
      document.cookie = "user=Peter Paul; expires=18 Dec 2028 12:00:00 UTC; path=/";
      alert("Cookie set!");
    }
    function getCookie() {
      alert("Cookies: " + document.cookie);
    }
    function updateCookie() {
      document.cookie = "user=Tuan Tran; expires=Thu, 18 Dec 2028 12:00:00 UTC; path=/";
      alert("Cookie updated!");
    }
    function deleteCookie() {
      document.cookie = "user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
      alert("Cookie deleted!");
    }
  </script>
</body>
</html>
