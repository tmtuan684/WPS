<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Flexbox demonstration 1</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0px;
            }
            header {
                background: rgb(179, 57, 57);
                height: 100px;
                margin: 0px;
            }
            h1 {
                color: white;
                text-align: center;
                line-height: 100px;
                margin: 0px;
            } 
            section {
                display: flex;
                flex-direction: row; /* row (by default), column, row-reverse, column-reverse */
                flex-wrap: wrap; /* shorthand for flex-direction and flex-wrap is flex-flow: row wrap */
            }
            article {
                background-color: rgb(8, 87, 156);
                padding: 10px;
                margin: 10px;
                /* min-width:400px; */
                flex: 1; /* all articles take up equal amount of spare space left after padding and margin have been set */
            }
            article:nth-of-type(3) {
                flex: 2; /* article third takes twice as much of the available space as the previous two */
            }
            h2, p {
                color: white;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Sample flexbox example</h1>
        </header>
        <section>
            <article>
                <h2>First article</h2>
                <p>Content…</p>
            </article>
            <article>
                <h2>Second article</h2>
                <p>Content…</p>
            </article>
            <article>
                <h2>Third article</h2>
                <p>Content…</p>
            </article>
            <!-- <article>
                <h2>Four article</h2>
                <p>Content…</p>
            </article>
            <article>
                <h2>Fifth article</h2>
                <p>Content…</p>
            </article> -->
        </section>
    </body>
</html>
