<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>
    <p>Perform basic arithmetic operations between two numbers a and b.</p>
    <script>
        // code generated by Github copilot
        let a = prompt("Enter number a:");
        let b = prompt("Enter number b:");
        let operation = prompt("Enter the operation (+, -, *, /):");
        let result;
        switch (operation) {
            case "+":
                result = a + b;
                break;
            case "-":
                result = a - b;
                break;
            case "*":
                result = a * b;
                break;
            case "/":
                result = a / b;
                break;
            default:
                alert("Invalid operation.");
                break;
        }

        if (result !== undefined) {
            alert(a + " " + operation + " " + b + " = " + result);
        }
    </script>
</body>
</html>
