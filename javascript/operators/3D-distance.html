<!DOCTYPE html>
<html>
<head>
    <title>3D Distance Calculator</title>
</head>
<body>
    <h1>Calculate the Distance Between Two Points in 3D Space</h1>
    <p>Enter the coordinates of two points (x1, y1, z1) and (x2, y2, z2) to calculate the distance.</p>
    <script>
        let A = prompt("Coordinate A (e.g., 0 0 0): ");
        let B = prompt("Coordinate B (e.g., 3 4 5): ");

        A = A.split(" "); // Split string of digits A into array of substring at separator " " 
        B = B.split(" ");

        // Calculate distance using the distance formula
        let d = Math.sqrt(Math.pow(B[0] - A[0], 2) + Math.pow(B[1] - A[1], 2) + Math.pow(B[2] - A[2], 2));

        // Display the result
        alert(`The distance between (${A[0]}, ${A[1]}, ${A[2]}) and (${B[0]}, ${B[1]}, ${B[2]}) is ${Math.round(d)}`);

    </script>
</body>
</html>
