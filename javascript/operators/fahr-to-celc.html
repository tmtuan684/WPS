<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Fahrenheit to Celcius</title>
    </head>
    <body>
        <script>
            /* Print Fahrenheit to Celcius Table
               fahr = 0, 10, 20, ..., 300 
            */
           let fahr, celc;
           let lower, upper, step;
           
           lower = 0;
           upper = 300;
           step = 10;
           fahr = lower;
           while (fahr <= upper) {
                celc = (5.0 / 9.0) * (fahr - 32);
                console.log(fahr + "\t" + celc);
                fahr = fahr + step;
           }
        </script>
    </body>
</html>
