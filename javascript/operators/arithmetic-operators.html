<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arithmetic Operators</title>
</head>
<body>
    <script>
        // Prompt user for an arithmetic expression
        let exp = prompt("Enter an arithmetic expression (e.g., (5 + 10) * 2):");
        let result = eval(exp);
        alert(exp + " = " + result);
        console.log(exp + " = " + result);
    </script>
</body>
</html>
