<!DOCTYPE html>
<html lang="en">
<head>
    <title>Session Storage Example</title>

</head>
<body>
    <h1>Session Storage Example</h1>
    <button onclick="setItem()">Set Item</button>
    <button onclick="getItem()">Get Item</button>
    <button onclick="removeItem()">Remove Item</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <div id="output"></div>

    <script>
        function setItem() {
            sessionStorage.setItem('username', 'JohnDoe');
            document.getElementById('output').textContent = 'Item set: username = JohnDoe';
        }

        function getItem() {
            const username = sessionStorage.getItem('username');
            document.getElementById('output').textContent = 'Retrieved item: username = ' + username;
        }

        function removeItem() {
            sessionStorage.removeItem('username');
            document.getElementById('output').textContent = 'Item removed: username';
        }

        function clearStorage() {
            sessionStorage.clear();
            document.getElementById('output').textContent = 'Session storage cleared!';
        }
    </script>
</body>
</html>
