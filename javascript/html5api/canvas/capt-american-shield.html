<!DOCTYPE html>
<html>
<head>
    <title>Captain American Shield</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            height: 80vh;
            
            border: 1px solid black;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        // Draw 4 concentric filled circles and 1 polygoned 5 point star
        function drawCaptAmericanShield() {
            
            const canvas = document.getElementById("canvas");
            // Set actual pixel size for sharp rendering
            const cssWidth = canvas.clientWidth;
            const cssHeight = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = cssWidth * dpr;
            canvas.height = cssHeight * dpr;

            console.log(`dpr = ${dpr}`);
            
            if (canvas.getContext) {
                console.log("Canvas has getContext");
                const ctx = canvas.getContext("2d");
                // Start drawing from here
               var x = canvas.width / 2;
               var y = canvas.height / 2;
               var radius = canvas.height / 2 - 50;
               
               // Step 1. Draw Red Outermost circle
               ctx.beginPath();
               ctx.fillStyle = "red";
               ctx.arc(x, y, radius, 0, Math.PI*2, true);
               ctx.fill();

               // Step 2. Draw white inner circle
               ctx.beginPath();
               ctx.fillStyle = "white";
               ctx.arc(x, y, radius*0.8, 0, Math.PI*2, true);
               ctx.fill();
               
               // Step 3. Draw red innermost circle
               ctx.beginPath();
               ctx.fillStyle = "red";
               ctx.arc(x, y, radius*0.6, 0, Math.PI*2, true);
               ctx.fill();

                // Step 4. Draw darkblue innermost circle
               ctx.beginPath();
               ctx.fillStyle = "#000054";
               ctx.arc(x, y, radius*0.4, 0, Math.PI*2, true);
               ctx.fill();

               // Step 5. Draw a white five pointed star
               ctx.beginPath();
               ctx.fillStyle = "white";
            const starRadiusOuter = radius * 0.35;
            const starRadiusInner = starRadiusOuter * 0.382; // Golden ratio for inner points
            const starCenterX = x;
            const starCenterY = y;
            for (let i = 0; i < 10; i++) {
                const angle =  Math.PI / 2 + i * Math.PI / 5;
                const r = i % 2 === 0 ? starRadiusOuter : starRadiusInner;
                const sx = starCenterX + r * Math.cos(angle);
                const sy = starCenterY - r * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(sx, sy);
                } else {
                    ctx.lineTo(sx, sy);
                }
            }
            ctx.closePath();
            ctx.fill();

            } else {
                // canvas unsupported code here
            }
        }

        // Call function draw... when window fully loads
        window.addEventListener("load", drawCaptAmericanShield);
    </script>
    
</body>
</html>
