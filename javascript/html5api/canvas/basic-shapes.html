<!DOCTYPE html>
<html>
<head>
    <title>Basic Shapes</title>
    <style>
        canvas {
            width: 80vw;
            height: 80vh;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="drawing-canvas" width="500" height="500">

    </canvas>
    <script>
      function draw() {
        const canvas = document.getElementById("drawing-canvas");
        if (canvas.getContext) {
          const ctx = canvas.getContext("2d");
        
          // Black Line, 1px thick
          ctx.strokeStyle = "black";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(50, 50);
          ctx.lineTo(200, 50);
          ctx.stroke();
          ctx.closePath();

          // red stroke Rectangle
          ctx.strokeStyle = "red";
          ctx.beginPath();
          ctx.moveTo(50, 80);
          ctx.lineTo(160, 80);
          ctx.lineTo(160, 150);
          ctx.lineTo(50, 150);
          ctx.closePath();
          ctx.stroke();

          // red filled Rectangle
          ctx.fillStyle = "red";
          ctx.beginPath();
          ctx.moveTo(180, 80);
          ctx.lineTo(280, 80);
          ctx.lineTo(280, 150);
          ctx.lineTo(180, 150);
          ctx.closePath();
          ctx.fill();

          // Rect with fillRect
          ctx.fillStyle = "green";
          ctx.fillRect(300, 80, 100, 70);

          // Draw filled triangle
          ctx.fillStyle = "blue";
          ctx.beginPath();
          ctx.moveTo(50, 170);
          ctx.lineTo(50, 250);
          ctx.lineTo(150, 170);
          ctx.closePath();
          ctx.fill();

        } else {
            // canvas unsupported code here
        }
      }
    window.addEventListener("load", draw);    // Call draw() when the window fully loads
    </script>
</body>
</html>
