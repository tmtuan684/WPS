<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Map API: Show map</title>
    <!-- Step 1. Include Leaflet CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Step 2. Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <div class="container my-3">
        <h1>Display a OSM Map</h1>
        <div id="map" class="container-fluid rounded-3 border border-1 border-light" style="height: 600px"></div>
    </div>
    <script>
        // Initiallize a OSM map
        var map = L.map('map');
        
        // Set view for a location identified by latitude and longitude on the map, and a zoom in level 
        map.setView([10.7763897,106.7011391], 20);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Add click event
        map.on('click', async (e) => {
            const url = `https://nominatim.openstreetmap.org/reverse?lat=${e.latlng.lat}&lon=${e.latlng.lng}&format=json`;

            const res = await fetch(url);
            const data = await res.json();

            console.log(data.display_name);
            new L.Marker([e.latlng.lat, e.latlng.lng]).addTo(map).bindPopup(data.display_name);      
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
