<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>OSM: Itinerary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" >
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style> 
    
      .distance-label {
  background: white;
  color: #dc3545;
  border: 3px solid #dc3545;
  font-size:xx-large;
  font-weight: bold;
  padding: 8px 12px;
  border-radius: 16px;
  white-space: nowrap;
}

  </style>


</head>

<body class="bg-light">

<div class="container py-4">
    <h3 class="mb-4 text-center">
        OpenStreetMap & Leaflet – Location Search
    </h3>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Input controls -->
            <div class="row g-2 mb-3">
                <div class="col">
                    <input type="text" id="mylocation" class="form-control" placeholder="What landmark are you searching for?">
                </div>
            </div>
            <div id='itinerary' class="d-grid mb-3">
            </div> 
            <div class="d-grid mb-3">
                <button id="locateBtn" class="btn btn-primary">
                    Set itinerary
                </button>
            </div>

            <!-- Map -->
            <div 
                id="map" 
                class="rounded"
                style="height: 800px;"
            ></div>

        </div>
    </div>
</div>

<script>
    var mylocation = document.getElementById('mylocation');
    var itinerary = document.getElementById('itinerary');
    var locateBtn = document.getElementById('locateBtn');


    var map = L.map('map').setView([10.8231, 106.6297], 13);
     L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
    var locs = [];
    
    mylocation.addEventListener('keydown', addLocation);
    locateBtn.addEventListener('click', locateOnMap);
    
    function addLocation(e) {
        if (e.key === 'Enter') {
            if(mylocation.value.length > 0) {
                locs.push(mylocation.value);
            }
            itinerary.innerText = locs.toString();
            mylocation.value = '';
        }
    }

    async function locateOnMap() {
        let coords = []; // coordinates of the locations
        let dists = []; // distance from location[i] to location[i+1]
        let distKm = 0;
        for (const loc of locs) {
            
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${loc.trim()}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!data.length) {
                alert('Location not found');
                return;
            }
            const lat = data[0].lat;
            const lng = data[0].lon;
            
            coords.push([lat, lng]);
            map.setView([lat, lng], 20);
            if(coords.length > 1) {
                let p1 = await L.latLng(coords[coords.length-2]);
                let p2 = await L.latLng(coords[coords.length-1]);
                console.log(p1);
                console.log(p2);
                const midPoint = L.latLng(
                    (p1['lat'] + p2.lat) / 2,
                    (p1.lng + p2.lng) / 2
                );

                distKm = (p1.distanceTo(p2) / 1000).toFixed(2);

                L.marker(midPoint, {
                    icon: L.divIcon({
                    className: 'distance-label',
                    html: `${distKm} km`
                    })
                }).addTo(map);
            }
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.marker([lat, lng])
                .addTo(map)
                .bindPopup(`${loc}.Distance from previous stop: ${distKm} km`);
        };
        L.polyline(coords, {color: 'red', weight: 4}).addTo(map);
        console.log(coords);
    }
</script>

</body>
</html>
