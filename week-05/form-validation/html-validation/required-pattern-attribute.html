<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Required pattern attributes</title>
</head>
<body>
    <form>
        <label for="school">Which school are you in?</label>
        <input id="school" name="school" required pattern="SSET|TBS|SCD" placeholder="SSET or TBS or SCD?">
        <button>Submit</button>
    </form>
    
</body>
</html>
