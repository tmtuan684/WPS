<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular expressions</title>
</head>
<body>
    <script>
        const re = /cat/;
        const txt = "The dog sits on the mat";
        const txt2 = "This catalogue is about cars"

        const re2 = new RegExp("dog");
        
        console.log(re.test(txt2));
        console.log(re2.test(txt));

    </script>
