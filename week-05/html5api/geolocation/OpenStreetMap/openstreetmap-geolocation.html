<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OSM + Geolocation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; }
    .toolbar {
      position: absolute; z-index: 1000; top: 10px; left: 10px;
      background: #fff; border-radius: 12px; padding: 8px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12); font: 14px/1.2 system-ui, sans-serif;
    }
    .toolbar button {
      border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer;
    }
    .status { margin-left: 8px; opacity: .8 }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <button id="locate">📍 Locate me</button>
    <span class="status" id="status">Waiting…</span>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    // --- 1) Initialize map with a neutral fallback view (Hanoi here) ---
    const map = L.map('map', { zoomControl: true }).setView([21.0285, 105.8542], 13);

    // OSM tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Reusable layers for user location
    let userMarker = null;
    let accuracyCircle = null;

    const statusEl = document.getElementById('status');
    const locateBtn = document.getElementById('locate');

    function setStatus(msg) { statusEl.textContent = msg; }

    // --- 2) One-time geolocation using getCurrentPosition ---
    function locateOnce() {
      if (!('geolocation' in navigator)) {
        setStatus('Geolocation not supported in this browser.');
        return;
      }
      setStatus('Locating…');

      const options = {
        enableHighAccuracy: true,   // try GPS for best accuracy
        timeout: 10000,             // give up after 10s
        maximumAge: 0               // don’t use cached position
      };

      navigator.geolocation.getCurrentPosition(onLocateSuccess, onLocateError, options);
    }

    function onLocateSuccess(pos) {
      const { latitude, longitude, accuracy } = pos.coords;

      // marker
      if (!userMarker) {
        userMarker = L.marker([latitude, longitude]).addTo(map)
          .bindPopup('You are here');
      } else {
        userMarker.setLatLng([latitude, longitude]);
      }

      // accuracy circle
      if (!accuracyCircle) {
        accuracyCircle = L.circle([latitude, longitude], {
          radius: accuracy
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng([latitude, longitude]).setRadius(accuracy);
      }

      // fit map around user & accuracy
      const group = L.featureGroup([userMarker, accuracyCircle]);
      map.fitBounds(group.getBounds().pad(0.5));

      setStatus(`Located (±${Math.round(accuracy)} m)`);
      userMarker.openPopup();
    }

    function onLocateError(err) {
      const codes = {
        1: 'Permission denied',
        2: 'Position unavailable',
        3: 'Timeout'
      };
      setStatus(`Location error: ${codes[err.code] || 'Unknown'}${err.message ? ' – ' + err.message : ''}`);
    }

    // Button wiring
    locateBtn.addEventListener('click', locateOnce);

    // Auto-run once on load (you can remove this if you prefer click-to-locate)
    locateOnce();

    // --- 3) (Optional) continuous tracking with watchPosition ---
    // Uncomment to track movement live:
    // let watchId = navigator.geolocation.watchPosition(onLocateSuccess, onLocateError, {
    //   enableHighAccuracy: true,
    //   maximumAge: 0,
    //   timeout: 20000
    // });
    // To stop watching later: navigator.geolocation.clearWatch(watchId);
  </script>
</body>
</html>
