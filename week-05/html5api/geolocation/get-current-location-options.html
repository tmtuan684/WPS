<!DOCTYPE html>
<html>
    <head>
        <title>Current Location</title>
    </head>
    <body>
        <script>
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    var latitude = pos.coords.latitude;
                    var longitude = pos.coords.longitude;
                    alert("Your position: " + latitude + ", " + longitude);
                },  
                () => {

                }, 
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        </script>
    </body>
</html>
