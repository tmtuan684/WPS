<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameboard</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        #board {
            width: 300px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-flow: row wrap;
            margin: 10% auto;
            gap: 1px;
          
        }
        .cell {
            width: calc(99% / 3);
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        } 
    </style>
</head>
<body>
    <div id="board"></div>
    <script>
        // Cells of the gameboard
        let a = [0,1,2,3,4,5,6,7,8];

        // grasp the board
        const board = document.getElementById("board");

        // add cells to the board
        for(let i = 0; i < a.length; i++) {
            // prepare one cell
            const cell = document.createElement("div");
            cell.innerText = a[i];
            cell.classList.add("cell");
            // put cell on the board
            board.appendChild(cell);
        }
    </script>
</body>
</html>
