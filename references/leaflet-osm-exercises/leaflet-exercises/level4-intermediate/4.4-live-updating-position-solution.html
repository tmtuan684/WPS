<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>4.4 Live-Updating Position (Solution)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    #panel { position: absolute; top: 10px; left: 50px; z-index: 1000;
             background: white; padding: 8px 12px; border-radius: 4px;
             box-shadow: 0 0 6px rgba(0,0,0,0.3); font-family: sans-serif; }
  </style>
</head>
<body>
<div id="panel">Simulating a shuttle moving along a route...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.7769, 106.7009], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const path = [
    [10.7725, 106.6980],
    [10.7772, 106.6953],
    [10.7800, 106.6870],
    [10.7906, 106.7060],
    [10.7850, 106.7100]
  ];

  L.polyline(path, { color: '#999', dashArray: '4 6' }).addTo(map);

  const shuttleIcon = L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;border-radius:50%;background:#e67e22;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });

  const shuttle = L.marker(path[0], { icon: shuttleIcon }).addTo(map);

  let segmentIndex = 0;
  let t = 0;
  const speed = 0.006; // progress per frame along each segment

  function animate() {
    const from = path[segmentIndex];
    const to = path[(segmentIndex + 1) % path.length];

    t += speed;
    if (t >= 1) {
      t = 0;
      segmentIndex = (segmentIndex + 1) % path.length;
    }

    const lat = from[0] + (to[0] - from[0]) * t;
    const lng = from[1] + (to[1] - from[1]) * t;
    shuttle.setLatLng([lat, lng]);

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
