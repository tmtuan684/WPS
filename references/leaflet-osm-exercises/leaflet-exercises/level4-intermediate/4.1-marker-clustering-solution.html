<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>4.1 Marker Clustering (Solution)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const map = L.map('map').setView([10.7769, 106.7009], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function randomPoints(center, count, spread) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      pts.push({
        lat: center[0] + (Math.random() - 0.5) * spread,
        lng: center[1] + (Math.random() - 0.5) * spread
      });
    }
    return pts;
  }

  const cafes = randomPoints([10.7769, 106.7009], 300, 0.25);

  const clusterGroup = L.markerClusterGroup();

  cafes.forEach((cafe, i) => {
    const marker = L.marker([cafe.lat, cafe.lng]).bindPopup(`Cafe #${i + 1}`);
    clusterGroup.addLayer(marker);
  });

  clusterGroup.addTo(map);
</script>
</body>
</html>
