    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

    [10.7772, 106.6953],
    [10.7800, 106.6870],
    [10.7906, 106.7060],
    [10.7850, 106.7100]
  ];

  L.polyline(path, { color: '#999', dashArray: '4 6' }).addTo(map);
