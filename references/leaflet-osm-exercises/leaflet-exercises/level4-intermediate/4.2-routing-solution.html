<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>4.2 Routing Between Two Points (Solution)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    #panel { position: absolute; top: 10px; left: 50px; z-index: 1000;
             background: white; padding: 10px 12px; border-radius: 4px;
             box-shadow: 0 0 6px rgba(0,0,0,0.3); font-family: sans-serif; max-width: 260px; }
  </style>
</head>
<body>
<div id="panel">
  Click the map to set a <b>start</b> point, then click again to set the <b>end</b> point.
  Click a third time to reset.
  <div id="result" style="margin-top: 8px;"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.7769, 106.7009], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const resultEl = document.getElementById('result');
  let startPoint = null;
  let endPoint = null;
  let startMarker = null;
  let endMarker = null;
  let routeLine = null;

  async function getRoute(start, end) {
    const url = `https://router.project-osrm.org/route/v1/driving/` +
                `${start.lng},${start.lat};${end.lng},${end.lat}` +
                `?overview=full&geometries=geojson`;

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (!data.routes || data.routes.length === 0) {
        resultEl.textContent = 'No route found.';
        return;
      }

      const route = data.routes[0];

      routeLine = L.geoJSON(route.geometry, {
        style: { color: '#e67e22', weight: 5 }
      }).addTo(map);

      const km = (route.distance / 1000).toFixed(2);
      const minutes = (route.duration / 60).toFixed(1);
      resultEl.innerHTML = `Distance: ${km} km<br>Duration: ${minutes} min`;

      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    } catch (err) {
      console.error(err);
      resultEl.textContent = 'Routing request failed -- check your connection.';
    }
  }

  function reset() {
    startPoint = null;
    endPoint = null;
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    resultEl.textContent = '';
  }

  map.on('click', (e) => {
    if (!startPoint) {
      startPoint = e.latlng;
      startMarker = L.marker(startPoint).addTo(map).bindPopup('Start').openPopup();
    } else if (!endPoint) {
      endPoint = e.latlng;
      endMarker = L.marker(endPoint).addTo(map).bindPopup('End').openPopup();
      getRoute(startPoint, endPoint);
    } else {
      reset();
    }
  });
</script>
</body>
</html>
