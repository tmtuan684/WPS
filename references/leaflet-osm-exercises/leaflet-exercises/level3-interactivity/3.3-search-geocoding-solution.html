<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3.3 Search / Geocoding (Solution)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    #search-box { position: absolute; top: 10px; left: 50px; z-index: 1000;
                  background: white; padding: 8px; border-radius: 4px;
                  box-shadow: 0 0 6px rgba(0,0,0,0.3); font-family: sans-serif; }
    #search-box input { width: 220px; padding: 6px; }
    #search-box button { padding: 6px 10px; margin-left: 4px; }
  </style>
</head>
<body>
<div id="search-box">
  <input id="query" type="text" placeholder="Search a place or address...">
  <button id="go">Search</button>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.7769, 106.7009], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let searchMarker = null;

  async function search(query) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

    try {
      const response = await fetch(url);
      const results = await response.json();

      if (results.length === 0) {
        alert('No results found');
        return;
      }

      const { lat, lon, display_name } = results[0];
      const latNum = parseFloat(lat);
      const lonNum = parseFloat(lon);

      map.flyTo([latNum, lonNum], 15);

      if (searchMarker) {
        searchMarker.setLatLng([latNum, lonNum]);
      } else {
        searchMarker = L.marker([latNum, lonNum]).addTo(map);
      }
      searchMarker.bindPopup(display_name).openPopup();
    } catch (err) {
      console.error(err);
      alert('Search failed -- check your connection.');
    }
  }

  document.getElementById('go').addEventListener('click', () => {
    const query = document.getElementById('query').value.trim();
    if (query) search(query);
  });

  document.getElementById('query').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const query = e.target.value.trim();
      if (query) search(query);
    }
  });
</script>
</body>
</html>
