<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2.4 Choropleth Map (Solution)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    .legend { background: white; padding: 8px 10px; line-height: 18px; border-radius: 4px;
               box-shadow: 0 0 6px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 13px; }
    .legend i { width: 16px; height: 16px; float: left; margin-right: 6px; opacity: 0.8; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.78, 106.70], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const districts = {
    type: 'FeatureCollection',
    features: [
      { type: 'Feature', properties: { name: 'District A', density: 12 },
        geometry: { type: 'Polygon', coordinates: [[[106.68,10.79],[106.70,10.79],[106.70,10.77],[106.68,10.77],[106.68,10.79]]] } },
      { type: 'Feature', properties: { name: 'District B', density: 45 },
        geometry: { type: 'Polygon', coordinates: [[[106.70,10.79],[106.72,10.79],[106.72,10.77],[106.70,10.77],[106.70,10.79]]] } },
      { type: 'Feature', properties: { name: 'District C', density: 78 },
        geometry: { type: 'Polygon', coordinates: [[[106.68,10.77],[106.70,10.77],[106.70,10.75],[106.68,10.75],[106.68,10.77]]] } },
      { type: 'Feature', properties: { name: 'District D', density: 95 },
        geometry: { type: 'Polygon', coordinates: [[[106.70,10.77],[106.72,10.77],[106.72,10.75],[106.70,10.75],[106.70,10.77]]] } }
    ]
  };

  function getColor(d) {
    return d > 90 ? '#800026' :
           d > 70 ? '#bd0026' :
           d > 50 ? '#e31a1c' :
           d > 30 ? '#fc4e2a' :
           d > 10 ? '#fd8d3c' : '#ffeda0';
  }

  L.geoJSON(districts, {
    style: (feature) => ({
      fillColor: getColor(feature.properties.density),
      weight: 1,
      color: 'white',
      fillOpacity: 0.75
    }),
    onEachFeature: (feature, layer) => {
      layer.bindPopup(`<b>${feature.properties.name}</b><br>Density: ${feature.properties.density}`);
    }
  }).addTo(map);

  // Legend
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    const grades = [0, 10, 30, 50, 70, 90];
    div.innerHTML = '<b>Density</b><br>';
    for (let i = 0; i < grades.length; i++) {
      const from = grades[i];
      const to = grades[i + 1];
      div.innerHTML +=
        `<i style="background:${getColor(from + 1)}"></i> ${from}${to ? '&ndash;' + to : '+'}<br>`;
    }
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
