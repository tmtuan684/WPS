<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>1.2 Single Marker + Popup (Starter)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.7769, 106.7009], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // TODO: add a marker at [10.7769, 106.7009] (Ben Thanh Market area)
  // and bind a popup to it with a name/description.
  // Pattern: L.marker([lat, lng]).addTo(map).bindPopup('some text');
</script>
</body>
</html>
