<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img-overlaid-text-container {
            position: relative;
            width: 100%;
            height: 600px;
            text-align: center;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }

    </style>
</head>
<body>
    <div class="img-overlaid-text-container">
        <img src="bg-img.jpg" alt="Rembrandt - The storm at Galilee Sea">
        <p class="center">The Storm at Galilee Sea</p>
    </div>
</body>
</html>
