<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>OSM: Itinerary</title>

    <!-- Bootstrap CSS (light) -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
</head>

<body class="bg-light">

<div class="container py-4">
    <h3 class="mb-4 text-center">
        OpenStreetMap & Leaflet – Location Search
    </h3>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Input controls -->
            <div class="row g-2 mb-3">
                <div class="col">
                    <input type="text" id="mylocation" class="form-control" placeholder="What landmark are you searching for?">
                </div>
            </div>
            <div id='itinerary' class="d-grid mb-3">
            </div> 
            <div class="d-grid mb-3">
                <button id="locateBtn" class="btn btn-primary">
                    Set itinerary
                </button>
            </div>

            <!-- Map -->
            <div 
                id="map" 
                class="rounded"
                style="height: 800px;"
            ></div>

        </div>
    </div>
</div>

<script>
    var mylocation = document.getElementById('mylocation');
    var itinerary = document.getElementById('itinerary');
    var locateBtn = document.getElementById('locateBtn');


    var map = L.map('map').setView([10.8231, 106.6297], 13);
     L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
    var locs = [];
    
    mylocation.addEventListener('keydown', addLocation);
    locateBtn.addEventListener('click', locateOnMap);
    
    function addLocation(e) {
        if (e.key === 'Enter') {
            if(mylocation.value.length > 0) {
                locs.push(mylocation.value);
            }
            itinerary.innerText = locs.toString();
            mylocation.value = '';
        }
    }

    async function locateOnMap() {
        let coords = [];
        for (const loc of locs) {
            
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${loc.trim()}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!data.length) {
                alert('Location not found');
                return;
            }
            const lat = data[0].lat;
            const lng = data[0].lon;

            coords.push([lat, lng]);
            map.setView([lat, lng], 20);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.marker([lat, lng])
                .addTo(map)
                .bindPopup(loc);
        };
        L.polyline(coords, {color: 'red', weight: 4}).addTo(map);
        console.log(coords);
    }
</script>

</body>
</html>
