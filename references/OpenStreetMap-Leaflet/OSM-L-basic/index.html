<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Basic use of OpenStreetMap and Leaflet</title>
        <!-- Step 1. Include Leaflet CSS-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <!-- Step 2. Make sure you put this AFTER Leaflet's CSS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    <body>
        <!-- Step 3. Put a div element with a id where the map is; make sure the div has a defined height -->
        <div id="map" style="height: 180px"></div> 

        <!-- Step 4. Create a map-->
        <script>
            // Set Coordinates to be displayed
            let latitude = 10.7763897;
            let longitude = 106.7011391;
            
            // initialize the map on the "map" div with a given center and zoom
            var map = L.map('map', {
                center: [latitude, longitude], 
                zoom: 13
            });
            
            // Add OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Add OpenStreetMap tile layer
            L.marker([latitude, longitude]).addTo(map)


            </script> 

    </body>
</html>
