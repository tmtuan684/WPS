<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; background: #111; }
</style>
</head>
<body>
<h2>4.2 Particle System (Starter)</h2>
<p>Click the canvas to spawn particles that fly outward and fade.</p>
<canvas id="canvas" width="400" height="300"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let particles = [];

  function spawnParticles(x, y) {
    for (let i = 0; i < 20; i++) {
      // TODO: push a particle object with:
      // x, y (starting position)
      // vx, vy: random direction/speed, e.g. angle = Math.random() * Math.PI * 2, speed = 1 + Math.random() * 3
      //         vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed
      // alpha: 1 (starts fully opaque)
    }
  }

  function update() {
    // TODO: for each particle:
    // p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
    // then filter out particles where p.alpha <= 0
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc33';
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    spawnParticles(e.clientX - rect.left, e.clientY - rect.top);
  });

  loop();
</script>
</body>
</html>
