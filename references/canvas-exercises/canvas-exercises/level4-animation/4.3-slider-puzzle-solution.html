<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
</style>
</head>
<body>
<h2>4.3 Slider Puzzle Renderer (Solution)</h2>
<p>Click a tile adjacent to the blank space to slide it (animated).</p>
<canvas id="canvas" width="300" height="300"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const n = 3;
  const cellSize = 100;
  const BLANK = 0;

  function isAdjacent(board, i, j) {
    i = parseInt(i, 10);
    j = parseInt(j, 10);
    const size = Math.floor(Math.sqrt(board.length));
    return (Math.abs(i - j) === size) ||
           (Math.abs(i - j) === 1 && Math.floor(i / size) === Math.floor(j / size));
  }

  function isSolvable(board) {
    let inversion = 0;
    const tiles = board.filter(v => v !== BLANK);
    for (let i = 0; i < tiles.length - 1; i++) {
      for (let j = i + 1; j < tiles.length; j++) {
        if (tiles[i] > tiles[j]) inversion++;
      }
    }
    return inversion % 2 === 0;
  }

  let board = [1, 2, 3, 4, 5, 6, 7, 8, 0];

  function shuffle(arr) {
    let a = arr.slice();
    do {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
    } while (!isSolvable(a));
    return a;
  }

  board = shuffle(board);

  // Animation state: while animating, one tile's drawn position is interpolated
  let animating = null; // { index, fromX, fromY, toX, toY, progress, blankIndex }

  function indexToXY(i) {
    const row = Math.floor(i / n);
    const col = i % n;
    return { x: col * cellSize, y: row * cellSize };
  }

  function drawTile(x, y, value) {
    ctx.beginPath();
    ctx.roundRect(x + 4, y + 4, cellSize - 8, cellSize - 8, 10);
    ctx.fillStyle = '#3366cc';
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = '32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(value, x + cellSize / 2, y + cellSize / 2);
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < board.length; i++) {
      const value = board[i];
      if (value === BLANK) continue;

      // If this index is currently animating, draw it at the interpolated position
      if (animating && animating.index === i) {
        const t = animating.progress;
        const x = animating.fromX + (animating.toX - animating.fromX) * t;
        const y = animating.fromY + (animating.toY - animating.fromY) * t;
        drawTile(x, y, value);
      } else {
        const { x, y } = indexToXY(i);
        drawTile(x, y, value);
      }
    }
  }

  function animateSlide(fromIndex, toIndex) {
    const from = indexToXY(fromIndex);
    const to = indexToXY(toIndex);
    animating = {
      index: fromIndex,
      fromX: from.x, fromY: from.y,
      toX: to.x, toY: to.y,
      progress: 0
    };

    function step() {
      animating.progress += 0.15;
      if (animating.progress >= 1) {
        // commit the swap now that the animation finished
        [board[fromIndex], board[toIndex]] = [board[toIndex], board[fromIndex]];
        animating = null;
        drawBoard();
        return;
      }
      drawBoard();
      requestAnimationFrame(step);
    }
    step();
  }

  canvas.addEventListener('click', (e) => {
    if (animating) return; // ignore clicks mid-animation

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const col = Math.floor(x / cellSize);
    const row = Math.floor(y / cellSize);
    const clickedIndex = row * n + col;

    const blankIndex = board.indexOf(BLANK);

    if (isAdjacent(board, clickedIndex, blankIndex)) {
      animateSlide(clickedIndex, blankIndex);
    }
  });

  drawBoard();
</script>
</body>
</html>
