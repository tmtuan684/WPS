<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  #tiles { display: flex; flex-wrap: wrap; width: 300px; margin: 20px auto; gap: 4px; }
  canvas { border: 1px solid #ccc; }
</style>
</head>
<body>
<h2>5.1 Image Slicer (Starter)</h2>
<p>Pick an image from your computer — it will be sliced into a 3x3 grid of tile canvases.</p>
<input type="file" id="fileInput" accept="image/*">
<div id="tiles"></div>
<script>
  const fileInput = document.getElementById('fileInput');
  const tilesContainer = document.getElementById('tiles');
  const n = 3; // 3x3 slices

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => sliceImage(img);
    img.src = URL.createObjectURL(file);
  });

  function sliceImage(img) {
    tilesContainer.innerHTML = '';

    // Work with a square source region so tiles come out square
    const side = Math.min(img.width, img.height);
    const sliceSize = side / n;   // size of each source slice, in source pixels
    const tileSize = 100;         // size to draw each output tile

    // TODO: nested loop over row (0..n-1), col (0..n-1)
    // For each cell:
    //   1. create a new <canvas> (tileSize x tileSize), append to tilesContainer
    //   2. get its 2d context
    //   3. use ctx.drawImage with the 9-argument form:
    //      ctx.drawImage(img,
    //        sx, sy, sWidth, sHeight,     // source rectangle (which part of the original image)
    //        0, 0, tileSize, tileSize)    // destination rectangle (fills the whole tile canvas)
    //      where sx = col * sliceSize, sy = row * sliceSize, sWidth = sHeight = sliceSize
  }
</script>
</body>
</html>
