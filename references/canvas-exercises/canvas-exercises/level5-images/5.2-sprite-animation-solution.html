<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; background: #fafafa; }
</style>
</head>
<body>
<h2>5.2 Sprite Animation (Solution)</h2>
<canvas id="canvas" width="200" height="200"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const frameSize = 64;
  const frameCount = 6;

  const sheet = document.createElement('canvas');
  sheet.width = frameSize * frameCount;
  sheet.height = frameSize;
  const sheetCtx = sheet.getContext('2d');

  for (let i = 0; i < frameCount; i++) {
    const cx = i * frameSize + frameSize / 2;
    const cy = frameSize / 2;
    const radius = 10 + (i / (frameCount - 1)) * 15;
    sheetCtx.beginPath();
    sheetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    sheetCtx.fillStyle = `hsl(${i * 40}, 70%, 55%)`;
    sheetCtx.fill();
  }

  let currentFrame = 0;
  let lastFrameTime = 0;
  const frameDuration = 150;

  function loop(timestamp) {
    if (timestamp - lastFrameTime > frameDuration) {
      lastFrameTime = timestamp;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sx = currentFrame * frameSize;
      const dx = 100 - frameSize / 2;
      const dy = 100 - frameSize / 2;

      ctx.drawImage(sheet, sx, 0, frameSize, frameSize, dx, dy, frameSize, frameSize);

      currentFrame = (currentFrame + 1) % frameCount;
    }
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
