<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; background: #fafafa; }
</style>
</head>
<body>
<h2>1.3 Traffic Light (Solution)</h2>
<canvas id="canvas" width="150" height="400"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Body
  ctx.beginPath();
  ctx.roundRect(20, 20, 110, 360, 20);
  ctx.fillStyle = '#333';
  ctx.fill();

  // Lights
  const lights = [
    { y: 90, color: 'red' },
    { y: 200, color: 'yellow' },
    { y: 310, color: 'green' }
  ];

  lights.forEach(light => {
    ctx.beginPath();
    ctx.arc(75, light.y, 40, 0, Math.PI * 2);
    ctx.fillStyle = light.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
</script>
</body>
</html>
