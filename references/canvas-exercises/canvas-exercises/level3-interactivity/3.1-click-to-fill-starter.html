<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; background: #fafafa; }
</style>
</head>
<body>
<h2>3.1 Click to Fill Cell (Starter)</h2>
<p>Click a cell in the 3x3 grid to fill it with color.</p>
<canvas id="canvas" width="300" height="300"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const cellSize = 100;
  const cols = 3;
  const rows = 3;

  function drawGrid() {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#333';
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        ctx.strokeRect(col * cellSize, row * cellSize, cellSize, cellSize);
      }
    }
  }

  function fillCell(row, col) {
    ctx.fillStyle = '#3366cc';
    ctx.fillRect(col * cellSize + 2, row * cellSize + 2, cellSize - 4, cellSize - 4);
  }

  // TODO: add a 'click' listener on canvas.
  // 1. Get mouse position relative to canvas: use canvas.getBoundingClientRect()
  //    const rect = canvas.getBoundingClientRect();
  //    const x = e.clientX - rect.left;
  //    const y = e.clientY - rect.top;
  // 2. Convert x, y into a row/col index: col = Math.floor(x / cellSize), row = Math.floor(y / cellSize)
  // 3. Call fillCell(row, col), then drawGrid() again (fill draws under the border lines)

  drawGrid();
</script>
</body>
</html>
