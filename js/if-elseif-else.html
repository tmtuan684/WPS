<!DOCTYPE html>
<html>
<head>
    <title>If-Elseif-Else Example</title>
</head>
<body>
    <script>
        let score = prompt("Enter a score:");
        if (score <50) {
            alert(score + " is a failing score.");
            console.log(score + " is a failing score.");
        } else if (score < 60) {
            alert(score + " is a passing score.");
            console.log(score + " is a passing score.");
        } else if (score < 70) {
            alert(score + " is a credit score.");
            console.log(score + " is a credit score.");
        } else if (score < 80) {
            alert(score + " is a distinction score.");
            console.log(score + " is a distinction score.");
        } else {
            alert(score + " is a high distinction score.");
            console.log(score + " is a high distinction score.");
        }
    </script>
</body>
</html>
