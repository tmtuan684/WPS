<!DOCTYPE html>
<html>
<head>
    <title>2D Distance Calculator</title>
</head>
<body>
    <h1>Calculate the Distance Between Two Points in 2D Plane</h1>
    <p>Enter the coordinates of two points (x1, y1) and (x2, y2) to calculate the distance.</p>
    <script>

        let x1 = prompt("Enter x1 coordinate:");
        let y1 = prompt("Enter y1 coordinate:");
        let x2 = prompt("Enter x2 coordinate:");
        let y2 = prompt("Enter y2 coordinate:");

        // Calculate distance using the distance formula
        let d = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));

        // Display the result
        alert(`The distance between (${x1}, ${y1}) and (${x2}, ${y2}) is ${d}`);

    </script>
</html>
