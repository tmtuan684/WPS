<!DOCTYPE html>
<html>
<head>
    <title>If-Elseif-Else Example</title>
</head>
<body>
    <script>
        let school = prompt("Which school do you attend at RMIT (SSET, TBS, SCD)?");
        switch (school) {
            case "SSET":
                alert("You are in the School of Science, Engineering and Technology.");
                break;
            case "TBS":
                alert("You are in the The Business School.");
                break;
            case "SCD":
                alert("You are in the School of Communication & Design.");
                break;
            default:
                alert("Unknown school.");
        }
    </script>
</body>
</html>
