<!DOCTYPE html>
<html>
<head>
    <title>If-Else Example</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number:");
        if (num > 0) {
            alert(num + " is a positive number.");
            console.log(num + " is a positive number.");
        } else {
            alert(num + " is a negative number.");
            console.log(num + " is a negative number.");
        } 
    </script>
</body>
</html>
