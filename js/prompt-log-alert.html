<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Prompt Log Alert</title>
    </head>
    <body>
        <h1>Prompt Log Alert</h1>
        <p>This is a simple prompt log alert page.</p>
        <script>
            let name = prompt("What is your name?");
            console.log("Hello, " + name);
            alert("Nice to meet you, " + name + "!");
        </script>
    </body>


</html>
