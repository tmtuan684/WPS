<!DOCTYPE html>
<html>
    <head>
        <title>Hello, name!</title>
    </head>
    <body>
        <script>
            /** prompts in a popup message box for input and prints the input to screen
             */
            let name = prompt("what is your name?");
            console.log("Hello, " + name + "!");
            alert("Hello, " + name + "!");
        </script>
    </body>
</html>
