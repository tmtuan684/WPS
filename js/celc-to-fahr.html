<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Fahrenheit to Celcius</title>
    </head>
    <body>
        <script>
            /* Print Celcius to Fahrenheit Table
               celc = 0, 10, 20, ..., 100 
            */
           let celc, fahr;
           let lower, upper, step;
           
           lower = 0;
           upper = 100;
           step = 10;
           // For loop has 3 parts
           // celc is initialize with 0
           // loop condition is celc <= upper
           // In the body of the loop, fahr is calculated from celc
           // then, celc is added with step
           for (celc = 0; celc <= upper; celc = celc + step) {
                fahr = (9.0 / 5.0) * celc + 32;
                console.log(celc + "\t" + fahr);
           }
        </script>
    </body>
</html>
