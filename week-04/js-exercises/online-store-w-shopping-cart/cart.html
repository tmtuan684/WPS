<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
    <link rel="icon" type="img/x-icon" href="https://images.pexels.com/photos/38519/macbook-laptop-ipad-apple-38519.jpeg">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .cart-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Electronic Shop</a>

      <div>
        <a class="btn btn-outline-light position-relative" href="cart.html">
          Cart
          <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            0
          </span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container my-5">
    <h2 class="mb-4">Your Shopping Cart</h2>

    <div id="cart-container"></div>

    <div class="mt-4 text-end">
      <a href="checkout.html" class="btn btn-success mt-3">Proceed to Checkout</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App JS -->
  <script src="utils.js"></script>
  <script src="cart.js"></script>

</body>
</html>
