<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link rel="icon" type="img/x-icon" href="https://images.pexels.com/photos/38519/macbook-laptop-ipad-apple-38519.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body>
    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="#">Electronics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="mainNav" class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Products</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light position-relative" href="cart.html">Cart
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                        </span>
                    </a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Support</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control form-control-sm me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-sm btn-outline-light" type="submit">Go</button>
                </form>
            </div>
        </div>
    </nav>
    <!-- HEADER -->
     <header class="bg-primary text-white py-5 mb-4">
        <div class="container text-center">
            <h1 class="display-5 fw-bold">Latest Electronic Products</h1>
            <p class="lead mb-3">Browse laptops, accessories, and gadgets curated for performance.</p>
            <a href="#product-list" class="btn btn-light btn-lg shadow-sm">Shop Now</a>
        </div>
    </header>
    <!-- MAIN CONTENT-->
   <main class="flex-grow-1">
        <div class="container pb-5">
            <h2 class="h4 mb-0">Products</h2>
            <section id="filter" class="d-flex justify-content-between align-items-center mb-3 col-12">
                <div id="product-filter" class="d-flex gap-2">
                    <select class="form-select form-select-sm" id="filter-option" aria-label="Sort products">
                        <option selected value="All">All</option>
                        <option value="Category">category</option>
                        <option value="Manufacturer">manufacturer</option>
                        <option value="Price">from price</option>
                    </select>
                    <input type="text" id="filter-value" class="form-control flex-grow-1" style="min-width: 320px" placeholder="What do you want to filter to?">
                    <!-- Added filter button -->
                    <button class="btn btn-sm btn-outline-primary" id="filter-btn" type="button" aria-pressed="false">Filter</button>
                </div>
            </section>
            <section id="product-list" class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4">
                <!-- JS will populate; sample placeholders below -->
            </section>
           <nav id="pagination" class="col-12 mt-3 px-auto" aria-label="Page navigation example">
                <ul class="pagination justify-content-center">
                    
                </ul>
           </nav>

        </div>
    </main>
    <!-- FOOTER -->
    <footer class="mt-auto bg-dark text-white py-4">
        <div class="container small d-flex flex-column flex-sm-row justify-content-between gap-3">
            <div>&copy; <span id="year"></span> Electronic Products</div>
            <div class="d-flex gap-3">
                <a href="#" class="link-light text-decoration-none">Privacy</a>
                <a href="#" class="link-light text-decoration-none">Terms</a>
                <a href="#" class="link-light text-decoration-none">Contact</a>
            </div>
        </div>
    </footer>
    <script src="products.js"></script>
    <script src="utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
