<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Local Storage Shopping Cart Example</title>
    </head>
    <body>
        <h1>Local Storage Shopping Cart Example</h1>
        <input type="text" id="itemInput" placeholder="Enter item name">
        <button onclick="addItem()">Add Item</button>
        <div id="cart"></div>

        <script>
            function addItem() {
                const item = document.createElement('div');
                item.textContent = document.getElementById('itemInput').value;
                document.getElementById('cart').appendChild(item);
                updateLocalStorage();
            }

            function updateLocalStorage() {
                const cartItems = document.querySelectorAll('#cart div');
                const items = Array.from(cartItems).map(item => item.textContent);
                localStorage.setItem('cart', JSON.stringify(items));
            }

            function loadCart() {
                const savedCart = localStorage.getItem('cart');
                if (savedCart) {
                    const items = JSON.parse(savedCart);
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.textContent = item;
                        document.getElementById('cart').appendChild(div);
                    });
                }
            }

            window.onload = loadCart;
        </script>
    </body>
</html>
