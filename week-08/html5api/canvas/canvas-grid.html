<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Canvas tutorial</title>
    <style>
       body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
       }
      canvas {
        width: 80vw;
        height: 80vh;
        margin: 10px auto;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      function draw() {
        const canvas = document.getElementById("canvas");
        // Set actual pixel size for sharp rendering
        const cssWidth = canvas.clientWidth;
        const cssHeight = canvas.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = cssWidth * dpr;
        canvas.height = cssHeight * dpr;

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // scale for high-DPI

        // Draw a thick red line (0,0), (canvas.width/dpr, 0)
        ctx.beginPath();
        ctx.strokeStyle = "red";
        ctx.lineWidth = 1;
        ctx.moveTo(0, 0);
        ctx.lineTo(cssWidth, 0);
        ctx.stroke();

        // Draw a red line (0,0), (0, canvas.height/dpr)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, cssHeight);
        ctx.stroke();

        // Draw a red outlined rectangle 
        ctx.beginPath();
        ctx.moveTo(10,10);
        ctx.lineTo(50, 10);
        ctx.lineTo(50, 50);
        ctx.lineTo(10, 50);
        ctx.closePath(); //
        ctx.strokeStyle = "red";
        ctx.stroke();

        //draw a filled blue rectangle
        ctx.beginPath();
        ctx.rect(60, 10, 100, 50);
        ctx.fillStyle = "blue";
        ctx.fill();
      }
      window.addEventListener("load", draw);    // Call draw() when the window fully loads
    </script>
  </body>
</html>
