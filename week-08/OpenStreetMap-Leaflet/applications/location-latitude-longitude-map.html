<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Basic use of OpenStreetMap and Leaflet</title>

    <!-- Bootstrap CSS (light) -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
</head>

<body class="bg-light">

<div class="container py-4">
    <h3 class="mb-4 text-center">
        OpenStreetMap & Leaflet – Location Search
    </h3>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Input controls -->
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <input type="text" id="mylocation" class="form-control" placeholder="What landmark are you searching for?">
                </div>

                <div class="col-md-3">
                    <input type="text" id="latitude" class="form-control" placeholder="Latitude" readonly>
                </div>

                <div class="col-md-3">
                    <input type="text" id="longitude" class="form-control" placeholder="Longitude" readonly>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button id="locateBtn" class="btn btn-primary">
                    Locate on Map
                </button>
            </div>

            <!-- Map -->
            <div 
                id="map" 
                class="rounded"
                style="height: 400px;"
            ></div>

        </div>
    </div>
</div>

<script>
    var mylocation = document.getElementById('mylocation');
    var latitude = document.getElementById('latitude');
    var longitude = document.getElementById('longitude');
    var locateBtn = document.getElementById('locateBtn');

    var map = L.map('map');

    locateBtn.addEventListener('click', locateOnMap);

    async function locateOnMap() {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${mylocation.value}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.length) {
            alert('Location not found');
            return;
        }

        latitude.value = data[0].lat;
        longitude.value = data[0].lon;

        map.setView([latitude.value, longitude.value], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        L.marker([latitude.value, longitude.value]).addTo(map);
    }
</script>

</body>
</html>
