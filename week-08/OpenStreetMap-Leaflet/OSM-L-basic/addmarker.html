<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Map API: Show map</title>
    <!-- Step 1. Include Leaflet CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Step 2. Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <div class="container my-3">
        <h1>Display a OSM Map</h1>
        <div id="map" class="container-fluid rounded-3 border border-1 border-light" style="height: 400px"></div>
    </div>
    <script>
        // Initiallize a OSM map
        var map = L.map('map');
        var mylocation = [10.7763897,106.7011391];
        // Set view for a location identified by latitude and longitude on the map, and a zoom in level 
        map.setView(mylocation, 20);

        // Make and Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Make and add marker to a location on a map; when clicked "HCM City" is poped up
        L.marker(mylocation).addTo(map).bindPopup("HCM City");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
