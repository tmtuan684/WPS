<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Flexbox demonstration 3</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0px;
            }
            header {
                background: rgb(179, 57, 57);
                height: 100px;
                margin: 0px;
            }
            h1 {
                color: white;
                text-align: center;
                line-height: 100px;
                margin: 0px;
            } 
            section {
                display: flex;
                flex-direction: row; /* row (by default), column, row-reverse, column-reverse */
                flex-wrap: wrap; /* shorthand for flex-direction and flex-wrap is flex-flow: row wrap */
            }
            article {
                background-color: rgb(8, 87, 156);
                padding: 10px;
                margin: 10px;
                flex: 1 100px; /* all articles take up equal amount of spare space left after padding and margin have been set */
            }
            article:nth-of-type(3) {
                flex: 3 100px; /* article third takes twice as much of the available space as the previous two */
                display: flex;
                flex-flow: column;
            }

            article:nth-of-type(3) div:first-child {
                 flex: 1 100px;
                 display: flex;
                 flex-flow: row wrap;
                 align-items: center;
                 justify-content: space-around;
            }
            h2, p {
                color: white;
            }
           
            button {
                flex:1 auto;
                margin: 5px;
                font-size: 18px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Sample flexbox example</h1>
        </header>
        <section>
            <article>
                <h2>First article</h2>
                <p>Content…</p>
            </article>
            <article>
                <h2>Second article</h2>
                <p>Content…</p>
            </article>
            <article>
                <div>
                    <button>Smile</button>
                    <button>Laugh</button>
                    <button>Wink</button>
                    <button>Shrug</button>
                    <button>Blush</button>
                </div>
                <div>
                    <p>Paragraph one content...</p>
                </div>
                <div>
                    <p>Paragraph two content...</p>
                </div>
            </article>
        
        </section>
    </body>
</html>
