<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Table 2</title>
</head>
<body>
    <table style="border: 1px solid black;">
        <caption>(Optional but encouraged) Table caption locates here</caption>
        <!-- Table is written row by row; the first row is headers; following the headers row is data row -->
        
        <tr><!-- tr stands for table row; this is the header row -->
            <th>Header 1</th> <!-- th stands for table header -->
            <th>Header 2</th>
            <th>Header 3</th>
            <th>Header 4</th>
        </tr>

        <tr>
            <td>Col 1 Row 1</td><!-- td stands for table data-->
            <td>Col 2 Row 1</td>
            <td>Col 3 Row 1</td>
            <td>Col 4 Row 1</td>
        </tr>

        <tr>
            <td>Col 1 Row 2</td>
            <td>Col 2 Row 2</td>
            <td>Col 3 Row 2</td>
            <td>Col 4 Row 2</td>
        </tr>

        <tr>
            <td>Col 1 Row 2</td>
            <td>Col 2 Row 2</td>
            <td>Col 3 Row 2</td>
            <td>Col 4 Row 2</td>
        </tr>
    </table>
</body>
</html>
