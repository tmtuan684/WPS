<!DOCTYPE html>
<html lang="en">
<head>
    <title>Budget</title>
    <style>
        body {
            text-align: center;
        }

        table { /* Align table center of a web page */
            margin-left: auto;
            margin-right: auto;
        }

        table, tr, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        td {
            width: 100px;
        }

    </style>
</head>
<body>
    <h1>Household Budget</h1>
    <table>
        <caption>Household budget detail</caption>
        
        <!-- Table headers -->
        <tr>
            <th>Expense</th>
            <th>Amount</th>
            <th>Name</th>
        </tr>
        <!-- Data -->
        <tr>
            <td>Rent</td>
            <td>$360</td>
            <td>Roommate 1</td>
        </tr>
        <tr>
            <td>Rent</td>
            <td>$350</td>
            <td>Roommate 2</td>
        </tr>
        <tr>
            <td>Rent</td>
            <td>$200</td>
            <td>Roommate 3</td>
        </tr>
        <tr>
            <td>Internet</td>
            <td>$20</td>
            <td>Roommate 1</td>
        </tr>
        <tr>
            <td>Cable TV</td>
            <td>$20</td>
            <td>Roommate 2</td>
        </tr>

    </table>

</body>
</html>
