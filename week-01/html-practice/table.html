<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    </head>
    <body>
        <table style="border: 1px solid black; border-collapse: collapse;">
            <caption>Front-end web developer course 2021</caption>
        <thead>
            <tr>
                <th>Person</th>
                <th>Most interested in</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Christ</td>
                <td>HTML Tables</td>
                <td>22</td>
            </tr>
            <tr>
                <td>Dennis</td>
                <td>Web accessibility</td>
                <td>45</td>
            </tr>
            <tr>
                <td>Sarah</td>
                <td>Javascript frameworks</td>
                <td>29</td>
            </tr>
            <tr>
                <td>Karen</td>
                <td>Web performance</td>
                <td>36</td>
            </tr>
        </tbody>
        <tfoot>
             <tr>
                <td colspan="2">Average</td>
                <td>33</td>
            </tr>
        </tfoot>
        </table>
    </body>
</html>
